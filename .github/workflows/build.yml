name: Build D2Trainer

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: sudo apt-get install -y mingw-w64

      - name: Compile resources
        run: x86_64-w64-mingw32-windres -F pe-x86-64 launcher_build.rc launcher_build.o

      - name: Build D2Trainer.exe
        run: |
          x86_64-w64-mingw32-gcc -O2 -mwindows -fno-stack-protector -static-libgcc \
            launcher.c launcher_build.o \
            -lwinhttp -ladvapi32 -lshell32 -luser32 -lgdi32 \
            -o D2Trainer.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: D2Trainer
          path: D2Trainer.exe
          retention-days: 7
